# IAM role that GitHub Actions assumes (via OIDC — no stored AWS credentials)
# to upload release installers to S3. Used by the `release` job in
# .github/workflows/build-desktop.yml, which runs only on `v*` tag pushes.
#
# Prerequisite: an IAM OIDC provider for token.actions.githubusercontent.com
# must already exist in this account (one usually does per-account, shared
# across repos/roles — this template does not create it, only references it).
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  IAM role for GitHub Actions (OIDC) to upload minutes-client release
  binaries to S3.

Parameters:
  GitHubOrg:
    Type: String
    Default: MaxwellKwesiEhiawey
  GitHubRepo:
    Type: String
    Default: minutes-client
  GitHubOwnerId:
    Type: String
    Default: "72410727"
    Description: >-
      Numeric GitHub account id of GitHubOrg. Required because this repo emits
      the *immutable* OIDC subject claim, which appends the database ids to the
      owner and repo names — see the trust policy below. Read it from the token
      itself (the `sub` claim in a workflow run) or from
      https://api.github.com/users/<owner>.
  GitHubRepoId:
    Type: String
    Default: "1286359176"
    Description: >-
      Numeric GitHub repository id of GitHubRepo. From the same `sub` claim, or
      https://api.github.com/repos/<owner>/<repo>.
  ArtifactBucketName:
    Type: String
    Default: version-release-bucket
  ReleasePrefix:
    Type: String
    Default: releases/
    Description: >-
      S3 key prefix release binaries are uploaded under, kept separate from
      the CodePipeline artifact-store's own internal object keys in the same
      bucket.

Resources:
  GitHubReleaseUploadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${GitHubRepo}-github-release-s3"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            # `sts:TagSession` is required, not optional decoration:
            # `aws-actions/configure-aws-credentials` attaches session tags
            # (repo, workflow, actor, ref, …) to every assume-role call unless
            # `role-skip-session-tagging: true` is set. Without permission to tag
            # the session, STS rejects the call as
            # "Not authorized to perform sts:AssumeRoleWithWebIdentity" — naming
            # the assume, never the tagging — which reads exactly like a `sub`
            # mismatch and costs an afternoon to find. Keep both actions.
            Action:
              - sts:AssumeRoleWithWebIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Scoped to tag pushes only — this role has no reason to be
              # assumable from a branch push or PR run.
              #
              # The `@<id>` suffixes are not a typo. This repo emits GitHub's
              # *immutable* subject claim, so the real `sub` is
              #
              #   repo:OWNER@72410727/REPO@1286359176:ref:refs/tags/v0.2.3
              #
              # not the familiar `repo:OWNER/REPO:ref:...`. The database ids are
              # baked in so that renaming — or deleting and recreating — a repo
              # cannot inherit this role's access. A policy written in the
              # classic form simply never matches, and AWS reports it as a plain
              # authorization failure with no hint that the subject was the
              # problem. Verify with the `sub` printed by a workflow run before
              # changing this.
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/tags/v*"
      Policies:
        - PolicyName: upload-release-binaries
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # Installers are hundreds of MB, so `aws s3 cp` uploads them as
                # multipart. `s3:PutObject` covers the parts and the complete;
                # aborting a failed upload is a separate action, and without it a
                # half-finished transfer leaves orphaned parts the job cannot
                # clean up. Write-only either way: no GetObject, no DeleteObject,
                # no bucket-level access — a release publisher never reads.
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub "arn:aws:s3:::${ArtifactBucketName}/${ReleasePrefix}*"

Outputs:
  RoleArn:
    Value: !GetAtt GitHubReleaseUploadRole.Arn
